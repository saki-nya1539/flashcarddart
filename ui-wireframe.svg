<svg viewBox="0 0 1220 1080" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1220" height="1080" fill="#f2f2f7"/>
  <text x="610" y="34" font-size="20" font-weight="bold" fill="#222" text-anchor="middle">FlashCardDart — 4ページ構成のワイヤーフレーム</text>

  <!-- ===================== Screen 1: デッキ一覧 ===================== -->
  <g>
    <rect x="40" y="60" width="540" height="460" rx="18" fill="#ffffff" stroke="#ccc" stroke-width="2"/>
    <rect x="40" y="60" width="540" height="52" rx="18" fill="#3f51b5"/>
    <rect x="40" y="94" width="540" height="18" fill="#3f51b5"/>
    <text x="60" y="94" font-size="16" fill="#fff" font-weight="bold">FlashCardDart — デッキ一覧</text>

    <!-- deck card 1 -->
    <rect x="58" y="130" width="504" height="72" rx="8" fill="#fafafa" stroke="#e0e0e0"/>
    <text x="74" y="156" font-size="15" font-weight="bold" fill="#222">英単語</text>
    <text x="74" y="178" font-size="12" fill="#666">24枚 ・ 復習待ち 5枚 ・ 習得済み 3枚</text>
    <circle cx="460" cy="166" r="16" fill="#eef0fb"/>
    <text x="460" y="171" font-size="12" fill="#3f51b5" text-anchor="middle">📊</text>
    <circle cx="506" cy="166" r="16" fill="#eef0fb"/>
    <text x="506" y="171" font-size="12" fill="#3f51b5" text-anchor="middle">🎓</text>
    <text x="546" y="171" font-size="14" fill="#666" text-anchor="middle">⋮</text>

    <!-- deck card 2 -->
    <rect x="58" y="214" width="504" height="72" rx="8" fill="#fafafa" stroke="#e0e0e0"/>
    <text x="74" y="240" font-size="15" font-weight="bold" fill="#222">基本情報技術者</text>
    <text x="74" y="262" font-size="12" fill="#666">40枚 ・ 復習待ち 0枚 ・ 習得済み 12枚</text>
    <circle cx="460" cy="250" r="16" fill="#eef0fb"/>
    <text x="460" y="255" font-size="12" fill="#3f51b5" text-anchor="middle">📊</text>
    <circle cx="506" cy="250" r="16" fill="#f0f0f0"/>
    <text x="506" y="255" font-size="12" fill="#aaa" text-anchor="middle">🎓</text>
    <text x="546" y="255" font-size="14" fill="#666" text-anchor="middle">⋮</text>

    <text x="74" y="322" font-size="11" fill="#999">タップ → カード編集画面へ</text>
    <text x="74" y="340" font-size="11" fill="#999">📊統計／🎓学習セッション／⋮メニューからデッキ削除</text>

    <circle cx="540" cy="480" r="22" fill="#3f51b5"/>
    <text x="540" y="487" font-size="20" fill="#fff" text-anchor="middle">＋</text>
    <text x="80" y="487" font-size="11" fill="#999">＋ボタン → デッキ作成ダイアログ</text>
  </g>

  <!-- ===================== Screen 2: カード編集 ===================== -->
  <g>
    <rect x="640" y="60" width="540" height="460" rx="18" fill="#ffffff" stroke="#ccc" stroke-width="2"/>
    <rect x="640" y="60" width="540" height="52" rx="18" fill="#3f51b5"/>
    <rect x="640" y="94" width="540" height="18" fill="#3f51b5"/>
    <text x="660" y="94" font-size="16" fill="#fff" font-weight="bold">英単語 — カード編集</text>

    <g font-size="13" fill="#222">
      <rect x="658" y="130" width="504" height="56" rx="6" fill="#fafafa" stroke="#eee"/>
      <text x="674" y="152" font-weight="bold">apple</text>
      <text x="674" y="172" fill="#666">りんご</text>
      <text x="1130" y="162" fill="#c62828">🗑</text>

      <rect x="658" y="196" width="504" height="56" rx="6" fill="#fafafa" stroke="#eee"/>
      <text x="674" y="218" font-weight="bold">banana</text>
      <text x="674" y="238" fill="#666">バナナ</text>
      <text x="1130" y="228" fill="#c62828">🗑</text>

      <rect x="658" y="262" width="504" height="56" rx="6" fill="#fafafa" stroke="#eee"/>
      <text x="674" y="284" font-weight="bold">grape</text>
      <text x="674" y="304" fill="#666">ぶどう</text>
      <text x="1130" y="294" fill="#c62828">🗑</text>
    </g>

    <text x="674" y="350" font-size="11" fill="#999">行をタップ → 編集ダイアログ／🗑 → 削除</text>

    <circle cx="1140" cy="480" r="22" fill="#3f51b5"/>
    <text x="1140" y="487" font-size="20" fill="#fff" text-anchor="middle">＋</text>
    <text x="680" y="487" font-size="11" fill="#999">＋ボタン → カード追加ダイアログ(表/裏を入力)</text>
  </g>

  <!-- arrow 1 -> 2 -->
  <path d="M 580 190 C 610 190 610 190 638 190" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ===================== Screen 3: 学習セッション ===================== -->
  <g>
    <rect x="40" y="560" width="540" height="480" rx="18" fill="#ffffff" stroke="#ccc" stroke-width="2"/>
    <rect x="40" y="560" width="540" height="52" rx="18" fill="#3f51b5"/>
    <rect x="40" y="594" width="540" height="18" fill="#3f51b5"/>
    <text x="60" y="594" font-size="16" fill="#fff" font-weight="bold">学習セッション（残り4枚）</text>

    <rect x="70" y="630" width="480" height="220" rx="10" fill="#fafafa" stroke="#ddd"/>
    <text x="310" y="740" font-size="26" fill="#222" text-anchor="middle">apple</text>
    <text x="310" y="820" font-size="12" fill="#999" text-anchor="middle">(カードをタップで裏面表示)</text>

    <rect x="220" y="866" width="180" height="40" rx="8" fill="#3f51b5"/>
    <text x="310" y="891" font-size="14" fill="#fff" text-anchor="middle">答えを見る</text>

    <text x="70" y="936" font-size="11" fill="#999">裏面を見た後は4段階で評価:</text>
    <g font-size="12" fill="#fff" text-anchor="middle">
      <rect x="70" y="948" width="106" height="34" rx="6" fill="#e53935"/>
      <text x="123" y="970">もう一度</text>
      <rect x="184" y="948" width="106" height="34" rx="6" fill="#fb8c00"/>
      <text x="237" y="970">難しい</text>
      <rect x="298" y="948" width="106" height="34" rx="6" fill="#1e88e5"/>
      <text x="351" y="970">普通</text>
      <rect x="412" y="948" width="106" height="34" rx="6" fill="#43a047"/>
      <text x="465" y="970">簡単</text>
    </g>
    <text x="70" y="1010" font-size="11" fill="#999">評価ボタン → ReviewSchedulerが次回出題日を再計算</text>
  </g>

  <!-- ===================== Screen 4: 統計 ===================== -->
  <g>
    <rect x="640" y="560" width="540" height="480" rx="18" fill="#ffffff" stroke="#ccc" stroke-width="2"/>
    <rect x="640" y="560" width="540" height="52" rx="18" fill="#3f51b5"/>
    <rect x="640" y="594" width="540" height="18" fill="#3f51b5"/>
    <text x="660" y="594" font-size="16" fill="#fff" font-weight="bold">英単語 — 統計</text>

    <g font-size="13" fill="#222">
      <line x1="658" y1="640" x2="1162" y2="640" stroke="#eee"/>
      <text x="674" y="662">総カード数</text>
      <text x="1146" y="662" text-anchor="end" font-weight="bold">24枚</text>

      <line x1="658" y1="678" x2="1162" y2="678" stroke="#eee"/>
      <text x="674" y="700">本日の復習待ち</text>
      <text x="1146" y="700" text-anchor="end" font-weight="bold">5枚</text>

      <line x1="658" y1="716" x2="1162" y2="716" stroke="#eee"/>
      <text x="674" y="738">習得済み(間隔21日以上)</text>
      <text x="1146" y="738" text-anchor="end" font-weight="bold">3枚</text>

      <line x1="658" y1="754" x2="1162" y2="754" stroke="#eee"/>
      <text x="674" y="776">平均難易度係数(ease factor)</text>
      <text x="1146" y="776" text-anchor="end" font-weight="bold">2.58</text>
    </g>

    <rect x="674" y="810" width="488" height="14" rx="7" fill="#e0e0e0"/>
    <rect x="674" y="810" width="61" height="14" rx="7" fill="#3f51b5"/>
    <text x="674" y="844" font-size="12" fill="#666">習得率: 13%</text>
  </g>

  <!-- arrows from screen1 down to 3 and 4 -->
  <path d="M 300 522 C 300 545 300 545 300 558" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="308" y="545" font-size="11" fill="#888">🎓</text>

  <path d="M 900 522 C 900 545 900 545 900 558" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="908" y="545" font-size="11" fill="#888">📊</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#888"/>
    </marker>
  </defs>

  <text x="610" y="1064" font-size="11" fill="#999" text-anchor="middle">FlashCardDart — Flutter Navigator による4画面遷移(デッキ一覧 → カード編集／学習セッション／統計)</text>
</svg>
